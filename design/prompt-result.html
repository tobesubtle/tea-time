<!-- Metadata Header -->

<div class="flex gap-2">

<button aria-label="Like output" class="flex items-center justify-center p-2 rounded-full bg-surface-container hover:bg-surface-container-high transition-colors active:scale-95 h-[44px] w-[44px] text-primary" id="likeBtn">
<span class="material-symbols-outlined" id="likeIcon" style="font-variation-settings: 'FILL' 0;">favorite</span>
</button>
</div>
</div>
<!-- Editable Text Area Container (Bento/Card style) -->
<div class="flex-1 relative bg-surface-container-lowest rounded-2xl border border-outline-variant shadow-sm overflow-hidden flex flex-col group transition-shadow focus-within:ring-2 focus-within:ring-secondary focus-within:border-transparent">
<!-- Decorative Lavender Accent -->
<div class="h-1 w-full bg-secondary-fixed"></div>
<textarea class="flex-1 w-full p-4 bg-transparent border-none resize-none outline-none font-body-md text-body-md text-on-surface no-scrollbar h-full" placeholder="생성된 내용이 여기에 나타납니다...">디자인 시스템은 고성능 프롬프트 엔지니어링 및 AI 워크플로우 관리를 위해 설계되었습니다. 브랜드 개성은 정밀하고 지적이며 세련된 것으로, 사용자의 창의적이고 기술적인 결과물이 중심을 차지하도록 물러나는 "조용한" 인터페이스를 제공하는 것을 목표로 합니다.

미학은 색조 미니멀리즘에 중점을 둔 기업 / 모던 스타일을 따릅니다. 여백, 의도적인 콘텐츠 계층 구조 및 미묘한 깊이를 활용하여 복잡한 정보를 구성합니다. 감정적인 목표는 초기 AI 도구의 혼란스러운 "해커" 미학에서 벗어나 전문적이고 신뢰할 수 있는 작업 공간으로 나아가는 집중된 차분함을 불러일으키는 것입니다.

디자인 시스템은 기본 8 간격 비율의 유체 그리드 모델을 사용합니다. 깊이는 주변 그림자로 보완된 톤 레이어를 통해 전달됩니다.</textarea>

<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        클립보드에 복사되었습니다
    </div>
<script>
        // Like Toggle Logic
        const likeBtn = document.getElementById('likeBtn');
        const likeIcon = document.getElementById('likeIcon');
        let isLiked = false;

        likeBtn.addEventListener('click', () => {
            isLiked = !isLiked;
            if (isLiked) {
                likeIcon.style.fontVariationSettings = "'FILL' 1";
                likeIcon.classList.add('text-error');
                likeBtn.classList.add('bg-error-container');
            } else {
                likeIcon.style.fontVariationSettings = "'FILL' 0";
                likeIcon.classList.remove('text-error');
                likeBtn.classList.remove('bg-error-container');
            }
        });

        // Copy Toast Logic
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        let toastTimeout;

        copyBtn.addEventListener('click', () => {
            // Clear existing timeout if multiple clicks
            if (toastTimeout) clearTimeout(toastTimeout);
            
            // Show toast
            toast.classList.remove('opacity-0');
            toast.classList.add('toast-enter');
            
            // Hide toast after 2.5s
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('opacity-0');
            }, 2500);
        });
    </script>
