<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; color: #0b1c30; }
        .geist-font { font-family: 'Geist', sans-serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim w-full top-0 sticky shadow-sm border-b border-outline-variant z-40">
<div class="flex items-center justify-between px-margin-mobile h-16">
<button class="p-2 text-on-surface-variant dark:text-outline hover:bg-surface-container-high transition-colors active:scale-95 duration-100 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">menu_open</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">티타임은 즐거워</h1>
<button class="p-1 rounded-full overflow-hidden w-8 h-8 hover:bg-surface-container-high transition-colors active:scale-95 duration-100 ring-2 ring-transparent hover:ring-outline-variant flex items-center justify-center bg-surface-container-high">
<span class="material-symbols-outlined text-[20px] text-primary">person</span>
</button>
</div>
</header>
<main class="px-margin-mobile py-lg space-y-xl max-w-container-max mx-auto md:w-[600px]">
<!-- Template Selector -->
<section class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block">선택된 템플릿</label>
<button class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex items-center justify-between shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] hover:shadow-[0_6px_8px_-1px_rgba(0,0,0,0.1)] transition-all hover:-translate-y-[1px] active:scale-[0.98]">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-secondary-container/10 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">analytics</span>
</div>
<div class="text-left">
<h2 class="font-title-lg text-title-lg text-on-surface">시장 분석 보고서</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">주어진 데이터를 기반으로 상세 요약을 생성합니다.</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">expand_more</span>
</button>
</section>
<!-- Dynamic Form Fields (Bento Grid Style) -->
<section class="space-y-md">
<h3 class="font-title-lg text-title-lg text-on-surface mb-xs">입력 변수</h3>
<div class="grid grid-cols-1 gap-md">
<!-- Variable 1 -->
<div class="bg-surface-container-lowest rounded-2xl p-md border border-outline-variant shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex justify-between items-start mb-sm">
<label class="font-label-md text-label-md text-primary flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">data_object</span>
                            {{주제}}&nbsp;</label>
<span class="px-2 py-0.5 rounded-full bg-error-container text-on-error-container font-code text-[12px]">필수</span>
</div>

<input class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg border border-outline-variant px-sm py-sm focus:ring-2 focus:ring-secondary focus:border-transparent outline-none transition-all placeholder:text-on-surface-variant/50 h-[44px]" placeholder="예: 3분기 기술 트렌드" type="text">
</div>
<!-- Variable 2 -->
<div class="bg-surface-container-lowest rounded-2xl p-md border border-outline-variant shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex justify-between items-start mb-sm">
<label class="font-label-md text-label-md text-primary flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">data_object</span>
                            {{대상}}&nbsp;</label>
</div>

<input class="w-full bg-surface text-on-surface font-body-md text-body-md rounded-lg border border-outline-variant px-sm py-sm focus:ring-2 focus:ring-secondary focus:border-transparent outline-none transition-all placeholder:text-on-surface-variant/50 h-[44px]" placeholder="예: 임원진" type="text">
</div>
</div>
</section>
<!-- File Attachment (Glassmorphism inspired) -->
<section class="space-y-sm">
<h3 class="font-title-lg text-title-lg text-on-surface mb-xs">참조 파일</h3>
<div class="grid grid-cols-2 gap-sm">
<button class="glass-card rounded-xl p-md flex flex-col items-center justify-center gap-sm h-[100px] hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-[28px] text-primary">upload_file</span>
<span class="font-label-md text-label-md text-on-surface">내 컴퓨터</span>
</button>
<button class="glass-card rounded-xl p-md flex flex-col items-center justify-center gap-sm h-[100px] hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-[28px] text-[#4285F4]">add_to_drive</span>
<span class="font-label-md text-label-md text-on-surface">구글 드라이브</span>
</button>
</div>
<!-- Attached File Chip -->
<div class="mt-sm flex flex-wrap gap-xs">
<div class="flex items-center gap-xs bg-surface-container-high rounded-full px-3 py-1 border border-outline-variant">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">picture_as_pdf</span>
<span class="font-body-sm text-body-sm text-on-surface max-w-[120px] truncate">Q2_Financials.pdf</span>
<button class="text-outline hover:text-error transition-colors rounded-full p-0.5"><span class="material-symbols-outlined text-[16px]">close</span></button>
</div>
</div>
</section>
<!-- Accordion: Recent History -->
<section class="mt-xl border-t border-outline-variant pt-md">
<details class="group">
<summary class="flex justify-between items-center font-title-lg text-title-lg cursor-pointer list-none text-on-surface hover:text-primary transition-colors">
<span class="">최근 히스토리 (현재 템플릿)</span>
<span class="material-symbols-outlined transition group-open:rotate-180">expand_more</span>
</summary>
<div class="mt-md space-y-xs">
<div class="p-sm bg-surface-container-low rounded-lg border border-outline-variant hover:bg-surface-container transition-colors cursor-pointer flex justify-between items-center">
<div>
<p class="font-label-md text-label-md text-on-surface">"3분기 기술 트렌드"</p>
<p class="font-body-sm text-body-sm text-on-surface-variant text-[12px]">2시간 전</p>
</div>
<span class="material-symbols-outlined text-outline text-[18px]">restore</span>
</div>
<div class="p-sm bg-surface-container-low rounded-lg border border-outline-variant hover:bg-surface-container transition-colors cursor-pointer flex justify-between items-center">
<div>
<p class="font-label-md text-label-md text-on-surface">"경쟁사 분석: Acme Corp"</p>
<p class="font-body-sm text-body-sm text-on-surface-variant text-[12px]">어제</p>
</div>
<span class="material-symbols-outlined text-outline text-[18px]">restore</span>
</div>
</div>
</details>
</section>
</main>
<!-- Floating Action Button -->
<div class="fixed bottom-[100px] right-margin-mobile z-50 md:right-[calc(50%-280px)]">
<button class="h-[56px] px-lg rounded-2xl bg-primary text-on-primary flex items-center gap-sm shadow-[0_4px_12px_rgba(9,20,38,0.3)] hover:shadow-[0_6px_16px_rgba(9,20,38,0.4)] hover:-translate-y-1 transition-all active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">play_arrow</span>
<span class="font-label-md text-label-md text-[16px]">검토 및 실행</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="bg-surface-container dark:bg-surface-container-lowest shadow-[0_-1px_3px_rgba(0,0,0,0.05)] fixed bottom-0 w-full z-50 md:hidden">
<div class="flex justify-around items-center h-20 pb-safe px-4">
<!-- Active Item (Templates) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: &quot;FILL&quot; 1;">description</span>
<span class="font-label-md text-label-md mt-1">템플릿</span>
</button>
<!-- Inactive Item -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-150 rounded-xl">
<span class="material-symbols-outlined text-[24px]">history</span>
<span class="font-label-md text-label-md mt-1">히스토리</span>
</button>
<!-- Inactive Item -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-150 rounded-xl">
<span class="material-symbols-outlined text-[24px]">admin_panel_settings</span>
<span class="font-label-md text-label-md mt-1">관리자</span>
</button>
</div>
</nav>


</body></html>
